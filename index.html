<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    
</head>
<body>
   <header class="header">
    <h1>Dashboard Layout</h1>
   </header>
   <aside class="sidebar">
    <div class="logo">&#9812;</div>
    <button type="button" id="resize">&#9776;</button>
   </aside>
   <main class="dashboard-main">
    <div class="card card-1"><h2>Welcome John Doe!</h2></div>
    <div class="card card-2"><h2>Orders - 2</h2></div>
    <div class="card card-3"><h2>Shipped - 3</h2></div>
    <div class="card card-4"><h2>Pending - 4</h2></div>
    <div class="card card-5"><h2>Revenue - 5</h2></div>
    <div class="card card-6"><h2>Users - 6</h2></div>
    <div class="card card-7"><h2>Subscriptions - 7</h2></div>
    <div class="card card-8"><h2>Analytics - 8</h2></div>
    <div class="card card-9"><h2>Inbox - 9</h2></div>
    <div class="card card-10"><h2>Calendar - 10</h2></div>
    <div class="card card-11"><h2>User Activity - 11</h2></div>
    <div class="card card-12"><h2>Sales Dynamics - 12</h2></div>
    <div class="card card-13"><h2>Tasks - 13</h2></div>
   </main>
   <footer class="footer">
    <h2>Footer</h2>
   </footer>
</body>
</html>
